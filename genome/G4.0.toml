# genome/G4.0.toml — Declarative Single Source of Truth for the Jarambit G4.0 Genome.
# Parsed at compile time by `crates/g4/build.rs` to generate:
#   - `#[repr(C)] pub struct G4DecodedParams` (zero BTreeMap string lookups in hot loops)
#   - `pub const G4_GENES: &[G4GeneSpec]`
#   - `docs/g4/generated/genome_table.md` and `docs/g4/paper/generated/genome_table.tex`
# Emitter strategy parameters (CMA covariance, step sizes sigma) are strictly excluded from the
# phenotype genome and `genome_sha256` (`G4-GEN-6`).

