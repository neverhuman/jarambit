# RS-karambit-v4 — G4 Continuous Multi-Objective Quality-Diversity Requirement Set.
# Authors: Jepson Taylor, Claude-HZ, AGY (2026-10-27).
# Scope: Veto-free continuous multi-objective requirement set (`W_ERGOLIGHT_v2`) for the G4 3D implicit karambit engine,
# preserving every RS-karambit-v3 load value (including 1.82 N·m solid-tip twist and 3,427 N spine on first yield 828 MPa)
# and stress-relieved L-PBF Ti-6Al-4V material properties without assuming HIP.
# RS-karambit-v1, RS-karambit-v2, and RS-karambit-v3 remain frozen and byte-for-byte unchanged.

id = "RS-karambit-v4"
version = 4
metric = "W_ERGOLIGHT_v2"
legacy_metric = "W_ERGOLIGHT_v1"
study = "engineering study, not a product"
configuration = "fixed_blade_one_piece_lpbf_ti6al4v_no_sheath"
hard_gates = false
provenance_doc = "requirements/PROVENANCE.md"
loads_file = "requirements/loads-v4.toml"
materials_file = "requirements/materials-v4.toml"
frame_file = "requirements/frame-v4.toml"

[constants]
material = "Ti-6Al-4V"
density_g_per_cm3 = 4.43
yield_bulk_mpa = 828.0
uts_bulk_mpa = 895.0
e_gpa = 113.8
nu = 0.342
mass_ceiling_g = 130.0
mass_target_g = 50.0
mass_stretch_g = 45.0
mass_floor_g = 25.0
lcb_confidence_k = 1.645
max_grid_mass_drift_frac = 0.02
max_plate_gci_3level = 0.05
bevel_grind_stock_mm = 0.30

[function_floors]
blade_reach_min_mm = 72.0
blade_reach_max_mm = 85.725
sharpened_arc_min_mm = 60.0
sharpened_arc_max_mm = 101.6
claw_turning_angle_min_deg = 35.0
claw_hook_drop_min_mm = 26.0
point_included_angle_3mm_max_deg = 55.0
point_width_2mm_max_mm = 3.50
point_tip_radius_max_mm = 0.25

[gate_s]
apex_min_mm = 0.05
apex_max_mm = 0.14
half_angle_min_deg = 17.5
half_angle_max_deg = 22.5
tip_t025_max_mm = 0.30
tip_t1_max_mm = 0.60
tip_t2_max_mm = 1.00
tip_taper_min_mm = 5.0
point_monotonic_window_mm = 10.0
serration_min_teeth_per_edge = 3
serration_min_depth_mm = 0.80

[structural_gates]
hiker_lateral_180n_sf_min = 1.00
hunter_lateral_260n_sf_min = 1.00
twist_body_1p82nm_sf_min = 1.00
hm_twist_16p2nm_sf_min = 1.00
solid_tip_torsion_0p80nm_sf_min = 1.00
solid_tip_pry_60n_sf_min = 1.00
spine_push_500n_sf_min = 1.00
spine_baton_3427n_ult_sf_min = 1.00
ring_bearing_300n_sf_min = 2.00
ring_back_30n_sf_min = 2.00
grip_squeeze_250n_sf_min = 1.00
tooth_snag_pry_sf_min = 1.00
goodman_fatigue_180n_sf_min = 1.00
buckling_lambda_min = 1.00
combined_lat_twist_sf_min = 1.00
per_case_sequence_ratio_min = 1.20
face_wrinkling_sf_min = 1.00

[ergonomics.ring]
bore_d_mm = 24.9
lip_w_mm = 8.0
crown_min_mm = 0.2
crown_max_mm = 0.4
bore_round_min_mm = 2.5
bore_round_max_mm = 3.5
