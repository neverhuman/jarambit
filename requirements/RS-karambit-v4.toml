length_min_mm = 64.0
length_max_mm = 72.0
swell_thickness_min_mm = 13.0
swell_thickness_max_mm = 17.0
swell_height_min_mm = 25.0
swell_height_max_mm = 28.0
swell_perimeter_min_mm = 65.0
swell_perimeter_max_mm = 75.0
swell_h_over_t_min = 1.5
swell_h_over_t_max = 2.0
edge_r_min_mm = 2.2
section_corner_r_min_mm = 4.0
groove_r_min_mm = 10.0
crest_r_min_mm = 5.0
saddle_depth_min_mm = 1.5
saddle_depth_max_mm = 2.5
mid_depth_min_mm = 1.5
