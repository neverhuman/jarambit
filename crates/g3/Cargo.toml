[workspace]

[package]
name = "jarambit-g3"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "g3-evolve"
path = "src/bin/g3_evolve.rs"

[[bin]]
name = "g3-release-tex"
path = "src/bin/g3_release_tex.rs"

[[bin]]
name = "g3-pilot"
path = "src/bin/g3_pilot.rs"

[[bin]]
name = "g3-gripfe"
path = "src/bin/g3_gripfe/main.rs"

[[bin]]
name = "g3-export-stl"
path = "src/bin/g3_export_stl.rs"

[[bin]]
name = "g3-bladefacts"
path = "src/bin/g3_bladefacts.rs"

[[bin]]
name = "g3-edgeprofile"
path = "src/bin/g3_edgeprofile.rs"

[[bin]]
name = "g3-bladefield"
path = "src/bin/g3_bladefield.rs"

[[bin]]
name = "g3-tipconv"
path = "src/bin/g3_tipconv.rs"

[dependencies]
jarambit-crescent = { path = "../crescent" }
jarambit-physics = { path = "../physics" }
faer = { version = "0.24", default-features = false, features = ["std", "linalg", "sparse", "sparse-linalg"] }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
