# Regression dataset recipes for `jarambit dataset build` (docs/REGRESSION_DATASETS.md).
# Every table is a CSV whose FINAL column is the target; all other columns are features.
version 1
min_rows 50
# Tables are sorted by genome hash (a deterministic pseudo-random order); larger tables keep the
# first max_rows rows. Raise it on big hosts with `dataset build --max-rows N` (0 = keep all).
max_rows 20000
leak_guard_r 0.9999

# ---- sources --------------------------------------------------------------------------------
# micro-records written by auto-evolve / rescreen / harvest-waves / add-physical
source records datasets/regression/records
# committed lossless gen-800 population archives (1.95 M genome + score rows, read via zstd)
source gen800 artifacts/versioned-evolution-archives-gen800-population-v1 cap=4000

# ---- feature sets (column families) -----------------------------------------------------------
featureset g   = g. gd.
featureset c   = c. a. gate. desc.
featureset gc  = g. gd. c. a. gate. desc.
featureset gcs = g. gd. c. a. gate. desc. s1.
featureset s   = s1.

# ---- targets ----------------------------------------------------------------------------------
# Stage-1 FEM screen outputs from the design (genome only / CAD only / both)
targets s1.* : g c gc
# Stage-2 independent assessment outputs (design, design + screen, screen only = multi-fidelity)
targets s2.* : g gc gcs s
# physical test results (titanium coupons and parts)
targets phys.* : g gc gcs
# historical gen-800 population: genome -> stored screen outputs
targets h.lat_rob h.ring_rob h.sf_hunter h.spg h.mass_g h.aes_score h.hausdorff h.emd h.relief_frac h.fit : g
# CAD-kernel surrogates: genome -> geometry the FEM depends on
targets c.mass_g c.blade_tip_to_heel c.blade_sharpened_arc c.grip_len c.ridge_min_halfwidth_mm c.sec_min_ioop_blade c.th_p05 a.score a.hausdorff : g

# never used as targets: binary flags, counts, provenance-like or CAD values filed under s1 for
# compatibility with harvested screens (their CAD twins c.mass_g / gate.ring_bearing_w_mm exist)
skip s1.floors_ok s1.mass_g s1.ring_bearing_w_mm
skip s2.qualified s2.all_16_gates s2.rs_v2_all_hard s2.battery_pass_count s2.em.rs_v2_all_hard
skip h.legal h.aes_pass h.n_rejects h.n_win h.novelty

# ---- leakage rules (features that are algebraic re-expressions of the target) ------------------
# exact copies are also removed automatically by leak_guard_r. Stage-1 targets never see s1.*
# features (their feature sets are design-only), so only Stage-2 targets need rules here.
leak s2.mass_g : s1.mass_g c.mass_g c.blank_g c.removed_frac
leak s2.mass_3d_g : s1.mass_g c.mass_g c.blank_g c.removed_frac
leak s2.ring_bearing_w_mm : s1.ring_bearing_w_mm gate.ring_bearing_w_mm
leak c.ridge_min_halfwidth_mm : c.ridge_min_body_mm
