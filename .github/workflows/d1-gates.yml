name: d1-gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d1-gates-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'codex/science-v1-foundation-publication-cd31377' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # JARAMBIT_ANCHOR deliberately unset: C.6 is the gate anchor.

jobs:
  test:
    defaults:
      run:
        shell: bash ops/ci/run_bounded.sh d1 {0}
    name: cargo test --release + D1 gate smoke
    # General local pool; this capability requires the pinned Rust toolchain and memcap.
    runs-on: [self-hosted, linux, x64, xbabe, general, jarambit-d1]
    # Retain a finite ceiling for the workspace step and downstream controls.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Read installed binaries directly; concurrent runners share Rustup shims.
      - name: Select preinstalled pinned Rust toolchain without shared writes
        run: python3 -B ops/ci/select_rust_toolchain.py
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            . -> target
            crates/g3 -> crates/g3/target
      - name: cargo test --release (all crates, incl. D1 owner-lock gate tests)
        # Retained exporter work exceeded 45 minutes on a general-pool host.
        # A uniform 75-minute step leaves 15 minutes below the job ceiling.
        timeout-minutes: 75
        run: |
          export TMPDIR="$PWD/target/ci-d1-tmp/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$TMPDIR"
          TIMEFORMAT='CI_CARGO_TIMING wall_seconds=%3R user_seconds=%3U system_seconds=%3S'
          time cargo test --release --locked --workspace -- --test-threads=2
      - name: Clippy - no Option::unwrap_or_default in the CLI (missing FEM must be null + status, PR-0.28.3)
        run: cargo clippy --release -p jarambit -- -A clippy::all -D clippy::disallowed_methods
      - name: D1 owner-lock gate tests (explicit, fast)
        run: cargo test --release -p jarambit-crescent d1_lock -- --nocapture
      - name: G3 standalone crate tests (hermetic 27/27)
        timeout-minutes: 25
        run: cargo test --release --locked --manifest-path crates/g3/Cargo.toml -- --test-threads=2
      - name: D1 smoke (crescent-d1 on wave14_c03 reference)
        run: |
          cargo build --release -p jarambit
          D1_PLATES=1 ./target/release/jarambit crescent-d1 \
            --genomes w14c03=docs/d1/wave15_16_collect/wave14_c03_genome.csv \
            --threads "$(nproc)" --out out/ci_d1
          python3 ops/ci/d1_smoke.py out/ci_d1
          python3 ops/ci/check_json_strict.py out/ci_d1
      - name: Reproduce retained genome exports and inspect independent STEP bore geometry
        run: |
          export TMPDIR="$PWD/target/ci-cad-tmp/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$TMPDIR"
          cargo build --release --locked -p jarambit-crescent --example export_step
          python3 ops/ci/check_export_regeneration.py
          python3 -m venv target/ci-cad-env
          target/ci-cad-env/bin/python -m pip install -r fem_solid/requirements.txt
          target/ci-cad-env/bin/python -m unittest discover -s ops/ci/cad_tests -v
      - name: Upload D1 smoke report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: d1-smoke
          path: out/ci_d1/d1_rescreen.*
          if-no-files-found: ignore
