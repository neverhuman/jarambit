name: runner-policy

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-runners:
    name: local runner policy (${{ matrix.host }})
    strategy:
      fail-fast: false
      matrix:
        host: [xbabe1, xbabe2, xbabe3, xbabe4]
    runs-on: [self-hosted, xbabe, general, '${{ matrix.host }}']
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify selected local host and Docker isolation on xbabe4
        env:
          EXPECTED_HOST: ${{ matrix.host }}
        run: |
          python3 -B - <<'PY'
          import json, os, platform, re
          from pathlib import Path
          host = os.environ['EXPECTED_HOST']
          name = os.environ['RUNNER_NAME']
          assert re.fullmatch(re.escape('jarambit-' + host) + r'(?:-[1-9][0-9]*)?', name), name
          if host == 'xbabe4':
              assert platform.system() == 'Linux' and Path('/.dockerenv').exists(), 'xbabe4 must run in Docker'
          print('LOCAL_CI_RUNNER=' + json.dumps({'host': host, 'name': name,
                'os': platform.system(), 'architecture': platform.machine(),
                'docker': Path('/.dockerenv').exists()}))
          PY
      - name: Test and enforce local general runners in Rust
        run: |
          runner_home="$(getent passwd "$(id -un)" | cut -d: -f6)"
          test -n "$runner_home"
          export CARGO_HOME="${runner_home}/.cargo"
          export RUSTUP_HOME="${runner_home}/.rustup"
          export PATH="${CARGO_HOME}/bin:${PATH}"
          if ! test -x "${CARGO_HOME}/bin/cargo"; then
            case "$(uname -m)" in
              x86_64) rust_target=x86_64-unknown-linux-gnu ;;
              aarch64) rust_target=aarch64-unknown-linux-gnu ;;
              *) echo "Unsupported Rust runner architecture: $(uname -m)" >&2; exit 1 ;;
            esac
            python3 - "$rust_target" "$RUNNER_TEMP/rustup-init" <<'PY'
          import sys
          from urllib.request import urlopen
          target, destination = sys.argv[1:]
          url = f'https://static.rust-lang.org/rustup/dist/{target}/rustup-init'
          with urlopen(url, timeout=60) as response, open(destination, 'wb') as output:
              output.write(response.read())
          PY
            chmod 700 "$RUNNER_TEMP/rustup-init"
            CARGO_HOME="$CARGO_HOME" RUSTUP_HOME="$RUSTUP_HOME" \
              "$RUNNER_TEMP/rustup-init" -y --no-modify-path --profile minimal \
              --default-toolchain 1.85.1 --default-host "$rust_target"
          fi
          test -x "${CARGO_HOME}/bin/cargo"
          cargo --version
          cargo test --locked -p jarambit-runner-policy
          cargo run --locked -p jarambit-runner-policy
