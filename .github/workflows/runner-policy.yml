name: runner-policy

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-runners:
    name: local runner policy (${{ matrix.host }})
    strategy:
      fail-fast: false
      matrix:
        host: [xbabe1, xbabe2, xbabe3, xbabe4]
    runs-on: [self-hosted, xbabe, general, '${{ matrix.host }}']
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify selected local host and Docker isolation on xbabe4
        env:
          EXPECTED_HOST: ${{ matrix.host }}
        run: |
          python3 -B - <<'PY'
          import json, os, platform, re
          from pathlib import Path
          host = os.environ['EXPECTED_HOST']
          name = os.environ['RUNNER_NAME']
          assert re.fullmatch(re.escape('jarambit-' + host) + r'(?:-[1-9][0-9]*)?', name), name
          if host == 'xbabe4':
              assert platform.system() == 'Linux' and Path('/.dockerenv').exists(), 'xbabe4 must run in Docker'
          print('LOCAL_CI_RUNNER=' + json.dumps({'host': host, 'name': name,
                'os': platform.system(), 'architecture': platform.machine(),
                'docker': Path('/.dockerenv').exists()}))
          PY
      - name: Test and enforce local general runners with Rust
        run: |
          runner_home="$(getent passwd "$(id -un)" | cut -d: -f6)"
          test -n "$runner_home"
          export CARGO_HOME="${CARGO_HOME:-${runner_home}/.cargo}"
          export RUSTUP_HOME="${RUSTUP_HOME:-${runner_home}/.rustup}"
          export PATH="${CARGO_HOME}/bin:${PATH}"
          if ! command -v cargo >/dev/null 2>&1; then
            case "$(uname -s):$(uname -m)" in
              Linux:x86_64) rust_host=x86_64-unknown-linux-gnu ;;
              Linux:aarch64|Linux:arm64) rust_host=aarch64-unknown-linux-gnu ;;
              Darwin:x86_64) rust_host=x86_64-apple-darwin ;;
              Darwin:arm64|Darwin:aarch64) rust_host=aarch64-apple-darwin ;;
              *) echo "Unsupported Rust runner platform: $(uname -s) $(uname -m)" >&2; exit 1 ;;
            esac
            rustup_tmp="$(mktemp -d)"
            curl --fail --location --silent --show-error \
              "https://static.rust-lang.org/rustup/dist/${rust_host}/rustup-init" \
              --output "${rustup_tmp}/rustup-init"
            chmod 700 "${rustup_tmp}/rustup-init"
            "${rustup_tmp}/rustup-init" -y --no-modify-path --profile minimal \
              --default-toolchain 1.85.1 --default-host "${rust_host}"
            rm -rf "${rustup_tmp}"
          fi
          command -v cargo
          command -v rustc
          cargo --version
          rustc --version
          cargo test --locked -p jarambit-runner-policy
          cargo run --locked -p jarambit-runner-policy
