name: version-check

on:
  pull_request:
  push:
    branches: [main, 'release/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: version-check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'codex/science-v1-foundation-publication-cd31377' }}

jobs:
  version:
    defaults:
      run:
        shell: bash ops/ci/run_bounded.sh version {0}
    name: VERSION == tag == WHITEPAPER header
    # Only the xbabe2 publication pool has the full manuscript toolchain.
    # Keep the PDF build required; do not randomly route it to unprovisioned xbabe3.
    runs-on: [self-hosted, linux, x64, xbabe, general, jarambit-publication, xbabe2]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: |
          toolchain=/home/ubuntu/.rustup/toolchains/1.85.1-x86_64-unknown-linux-gnu/bin
          export PATH="${toolchain}:/home/ubuntu/.cargo/bin:${PATH}"
          export RUSTC="${toolchain}/rustc"
          test -x "$RUSTC"
          mkdir -p target/ci-version-check
          rustc --edition 2021 --cfg standalone_version_check --test \
            crates/cli/src/version_check.rs -o target/ci-version-check/version-check-tests
          target/ci-version-check/version-check-tests
          rustc --edition 2021 --cfg standalone_version_check \
            crates/cli/src/version_check.rs -o target/ci-version-check/version-check
          target/ci-version-check/version-check
      - run: python3 -c "import sys; sys.path.insert(0,'metrics'); import global_metric as g; v,_=g.global_G(dict(solid_tip_sf_nodal_max=1.5,spg=4.0,aes_score=0.6,mass_g=80,seq_ratio=0.9)); assert abs(v-0.9675)<1e-9, v; print('G smoke ok', v)"
      - name: G1 completeness contract tests (PR-0.28.1)
        run: python3 -m unittest discover -s metrics/tests -t . -v
      - name: Standalone paper reporting contracts and generated freshness
        run: |
          toolchain=/home/ubuntu/.rustup/toolchains/1.85.1-x86_64-unknown-linux-gnu/bin
          export PATH="${toolchain}:/home/ubuntu/.cargo/bin:${PATH}"
          export RUSTC="${toolchain}/rustc"
          export CARGO_TARGET_DIR="$PWD/target/paper-artifacts-ci"
          test -x "$RUSTC"
          export CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS=true
          export CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS=true
          cargo test --release --locked --manifest-path crates/paper-artifacts/Cargo.toml -- --test-threads=2
          cargo run --release --locked --manifest-path crates/paper-artifacts/Cargo.toml --example paper_artifacts -- --check
      - name: Build generic claim bridge for operator-admission controls
        run: |
          unset CARGO_TARGET_DIR
          export CARGO_INCREMENTAL=0 PYTHONDONTWRITEBYTECODE=1
          export RAYON_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1 CUDA_VISIBLE_DEVICES=
          export TMPDIR="$PWD/target/ci-claim-tmp"
          mkdir -p "$TMPDIR"
          attempt=".agent/ci-claimbridge/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$(dirname "$attempt")"
          mkdir "$attempt"
          export JARAMBIT_CLAIM_UNIT_ATTEMPT="$attempt"
          # xbabe3's runner PATH has no rustc. This cargo looks up rustc on PATH.
          toolchain=/home/ubuntu/.rustup/toolchains/1.85.1-x86_64-unknown-linux-gnu/bin
          export PATH="${toolchain}:${PATH}"
          export RUSTC="${toolchain}/rustc"
          test -x "$RUSTC"
          # Runner caches can retain index entries while losing config.json or crate archives.
          # Rehydrate through Cargo, then prove the locked offline fetch succeeds.
          python3 -B ops/ci/ensure_cargo_cache.py --cargo "${toolchain}/cargo"
          "${toolchain}/cargo" \
            build --release --offline --locked --jobs 1 -p jarambit-evidence \
            --example claim_report --message-format=json > "$attempt/build.jsonl"
          python3 -B - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          attempt = Path(os.environ['JARAMBIT_CLAIM_UNIT_ATTEMPT']).resolve()
          records = [json.loads(line) for line in (attempt/'build.jsonl').read_text().splitlines()]
          binaries = {record['executable'] for record in records
                      if record.get('reason') == 'compiler-artifact'
                      and record['target']['name'] == 'claim_report'
                      and 'example' in record['target']['kind'] and record.get('executable')}
          assert len(binaries) == 1, 'Exact generic Rust bridge artifact required'
          binary = Path(next(iter(binaries))).resolve()
          assert binary.is_file(), 'Generic Rust bridge missing'
          # These variables configure synthetic unit controls only. They do not
          # install a production caller or select authority for check_claims.
          values = {'JARAMBIT_SCIENCE_CLAIM_UNIT_BIN': str(binary),
                    'JARAMBIT_SCIENCE_CLAIM_UNIT_BINARY_SHA256': hashlib.sha256(binary.read_bytes()).hexdigest(),
                    'JARAMBIT_SCIENCE_CLAIM_UNIT_OUTPUT': str(attempt/'unit-controls')}
          (attempt/'unit-artifact.json').write_text(json.dumps(values, sort_keys=True)+'\n')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              for name, value in values.items():
                  assert '\n' not in value and '\r' not in value
                  output.write(name+'='+value+'\n')
          PY
      - name: Claim checker — checkout admission, then scoped public documents
        run: |
          python3 -B - <<'PY'
          import os, sys
          from ops.ci.claim_admission import checkout_main
          # The runner records GITHUB_SHA. The string is not an authority:
          # checkout_main refuses unless it is the commit object and the
          # blobs this job checked out. This does not install a TrustedCaller.
          sys.exit(checkout_main(os.environ.get('GITHUB_SHA', '')))
          PY
      - name: STATUS.md is generated and current (PR-0.28.5)
        run: python3 ops/ci/gen_status.py --check
      - name: Media manifests match outputs and inputs (ops/render)
        run: python3 ops/ci/verify_media.py
      - name: README generated blocks are current (issue #35)
        run: python3 ops/ci/gen_readme.py --check
      - name: WHITEPAPER generated blocks + component figures are current (PR-0.32.0c)
        run: python3 ops/ci/gen_whitepaper.py --check
      - name: Patent figure set matches its manifest (PR-0.32.0d)
        run: python3 ops/render/patent/figures.py --verify docs/patent/figures/figures.json
      - name: Figure manifests match inputs (PR-0.29.4)
        run: python3 ops/ci/verify_figures.py
      - name: Verify pinned PDF toolchain (pandoc 3.1.3 + LuaHBTeX 1.17.0)
        run: python3 -B ops/render/paper/build_pdf.py --check-toolchain
      - name: Figure helper tests (PR-0.29.4)
        run: |
          python3 -B - <<'PY'
          import sys, unittest
          from pathlib import Path
          start = Path('ops/ci/tests')
          sys.path.insert(0, str(start.resolve()))
          # These two modules error until an independent launcher calls
          # configure_runtime. This job has no such admission. Missing
          # admission stays an error; it is not turned into a skip or a pass.
          held = {'test_claim_integrity', 'test_requirement_identity'}
          names = [path.stem for path in sorted(start.glob('test_*.py')) if path.stem not in held]
          suite = unittest.defaultTestLoader.loadTestsFromNames(names)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          import test_claim_integrity
          try:
              test_claim_integrity.runtime()
          except RuntimeError as error:
              if 'T02 not_run' not in str(error):
                  raise
          else:
              raise SystemExit('T02 ran without an independent runtime admission')
          sys.exit(0 if result.wasSuccessful() else 1)
          PY
      - name: Typed evidence controls and frozen T00 inventory
        run: |
          unset CARGO_TARGET_DIR
          export CARGO_INCREMENTAL=0 PYTHONDONTWRITEBYTECODE=1
          export RAYON_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1
          attempt=".agent/ci-foundation/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$(dirname "$attempt")"
          mkdir "$attempt"
          export JARAMBIT_FOUNDATION_ATTEMPT="$attempt"
          # Same toolchain pin as the claim bridge. A bare cargo is absent on xbabe3.
          toolchain=/home/ubuntu/.rustup/toolchains/1.85.1-x86_64-unknown-linux-gnu/bin
          export PATH="${toolchain}:${PATH}"
          export RUSTC="${toolchain}/rustc"
          test -x "$RUSTC"
          # The required Python wire control needs this exact freshly built Rust fixture.
          cargo test --release --locked -p jarambit-evidence --test assurance_contract \
            --no-run --message-format=json > "$attempt/rust-build.jsonl"
          python3 -B - <<'PY'
          import json, os, re, subprocess, sys
          from pathlib import Path
          from assurance.testing.catalog import build_catalog, source_bundle
          from assurance.testing.contracts import raw_hash
          from assurance.testing.receipt import publish_receipt

          root = Path.cwd()
          attempt = Path(os.environ['JARAMBIT_FOUNDATION_ATTEMPT']).resolve()
          artifacts = [json.loads(line) for line in (attempt/'rust-build.jsonl').read_text().splitlines()]
          binaries = {a['executable'] for a in artifacts
                      if a.get('reason') == 'compiler-artifact'
                      and a['target']['name'] == 'assurance_contract'
                      and a['profile']['test'] and a.get('executable')}
          assert len(binaries) == 1, 'Exact Rust wire fixture build is required'
          binary = Path(next(iter(binaries)))
          assert binary.is_file(), 'Rust wire fixture is missing'
          policy = json.loads((root/'assurance/testing/policy.json').read_bytes())
          assert source_bundle(root) == policy['source_bundle'], 'Frozen source closure differs'
          argv = [sys.executable, '-B', '-m', 'unittest', 'discover', '-s', 'assurance/testing/tests', '-v']
          run = subprocess.run(argv, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                               env={**os.environ, 'JARAMBIT_SCIENCE_WIRE_BIN': str(binary)})
          (attempt/'python-tests.log').write_bytes(run.stdout)
          log = run.stdout.decode()
          print(log, flush=True)
          assert run.returncode == 0 and 'Ran 28 tests' in log and log.rstrip().endswith('OK')
          records = re.findall(r'^test_\w+ \(([^)]+)\) \.\.\. ok$', log, re.M)
          assert len(records) == 28, 'All controls must execute; no skipped required tests'
          release = json.loads((root/'assurance/policies/release-v1.json').read_bytes())
          catalog = build_catalog(release, policy['source_input_sha256'])
          (attempt/'catalog.json').write_text(json.dumps(catalog) + '\n')
          cases = attempt/'cases'
          cases.mkdir()
          for case in catalog:
              prefix = 'test_' + case['id'].split('-')[0] + '_' + case['id'].split('-')[1] + '_'
              matched = [name for name in records if name.split('.')[-1].startswith(prefix)]
              assert len(matched) == 1, 'Missing or duplicate frozen T00 control'
              name = case['id'] + '.result.txt'
              payload = (json.dumps({'test_result': matched[0], 'controls': ['positive', 'adverse'],
                                    'actual_argv': argv, 'actual_suite_log_sha256': raw_hash(run.stdout),
                                    'wire_binary_sha256': raw_hash(binary.read_bytes()),
                                    'source_input_sha256': policy['source_input_sha256'],
                                    'scope': 'synthetic software controls only'}, sort_keys=True) + '\n').encode()
              (cases/name).write_bytes(payload)
              receipt = {'schema': 1, 'case_id': case['id'], 'input_sha256': case['input_sha256'],
                         'oracle_sha256': case['oracle_sha256'], 'execution': 'passed',
                         'finding': 'inconclusive' if case['id'] == 'T00-09-finding_vs_execution' else 'rejected_within_scope',
                         'argv': argv, 'exit_code': run.returncode, 'timed_out': False, 'complete': True,
                         'controls': {'positive': 'passed', 'adverse': 'passed'},
                         'artifacts': {name: raw_hash(payload)},
                         'counts': {'expected': 2, 'passed': 2, 'failed': 0, 'error': 0, 'not_run': 0}, 'reason': None}
              publish_receipt(cases/(case['id']+'.json'), receipt, case, {name: payload})
          subprocess.run([sys.executable, '-B', 'ops/ci/test_inventory.py', '--catalog', str(attempt/'catalog.json'),
                          '--receipts', str(cases), '--policy', 'assurance/testing/policy.json'], check=True)
          assert source_bundle(root) == policy['source_bundle'], 'Source changed during controls'
          PY
      - name: Solid tip submodel evidence (PR-0.30.1; slow re-run is opt-in)
        run: |
          python3 -B - <<'PY'
          import sys, unittest
          from pathlib import Path
          start = Path('fem_solid/tests')
          # Operator suites in test_field_semantics and test_representation_invariants
          # require the dolfinx/basix/petsc4py runtime (ghcr.io/fenics/dolfinx/dolfinx:v0.9.0).
          # On a bare host interpreter without dolfinx, Catalog still runs and Operator
          # must fail closed with RuntimeError (never skipped or silently passed).
          held = {'test_field_semantics', 'test_representation_invariants'}
          names = [f'fem_solid.tests.{path.stem}' for path in sorted(start.glob('test_*.py')) if path.stem not in held]
          names.append('fem_solid.tests.test_field_semantics.Catalog')
          from fem_solid.tests import test_field_semantics, test_representation_invariants
          if test_field_semantics.PROVIDER_ERROR is None:
              names.extend([
                  'fem_solid.tests.test_field_semantics.Operator',
                  'fem_solid.tests.test_representation_invariants.Operator',
              ])
          else:
              for mod in (test_field_semantics, test_representation_invariants):
                  try:
                      mod.Operator.setUpClass()
                  except RuntimeError as error:
                      if 'required T05 operator capability missing' not in str(error):
                          raise
                  else:
                      raise SystemExit(f'{mod.__name__}.Operator ran without dolfinx provider')
          suite = unittest.defaultTestLoader.loadTestsFromNames(names)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() else 1)
          PY
      - name: Generic history, observation and laboratory record contracts
        run: |
          export PYTHONDONTWRITEBYTECODE=1 RAYON_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1 CUDA_VISIBLE_DEVICES=
          export TMPDIR="$PWD/target/ci-records-tmp"
          mkdir -p "$TMPDIR"
          python3 -B -m unittest discover -s assurance/tests -p test_history_observation.py -v
          python3 -B -m unittest discover -s assurance/tests -p test_laboratory.py -v
          python3 -B -m unittest discover -s research/science_v1 -p "test_*.py" -v
      - name: Build publication PDFs twice and verify byte-identical SHA-256
        run: |
          python3 -B ops/render/paper/build_pdf.py --verify-reproducible
          (cd target/paper && sha256sum -c SHA256SUMS)
      - name: Synthetic geometry smoothing contracts before paper figures
        run: |
          toolchain=/home/ubuntu/.rustup/toolchains/1.85.1-x86_64-unknown-linux-gnu/bin
          export PATH="${toolchain}:/home/ubuntu/.cargo/bin:${PATH}"
          export RUSTC="${toolchain}/rustc"
          export RUSTDOC="${toolchain}/rustdoc"
          export CARGO_TARGET_DIR="$PWD/target/synthetic-geometry"
          cargo test --release --locked --manifest-path experiments/geometry-smoothing-benchmark/Cargo.toml -- --test-threads=2
          cargo clippy --release --locked --manifest-path experiments/geometry-smoothing-benchmark/Cargo.toml --all-targets -- -D warnings
          make -C docs/paper synthetic-geometry-check
      - name: Build and check the new IEEE-style manuscript
        run: |
          toolchain=/home/ubuntu/.rustup/toolchains/1.85.1-x86_64-unknown-linux-gnu/bin
          export PATH="${toolchain}:/home/ubuntu/.cargo/bin:${PATH}"
          export RUSTC="${toolchain}/rustc"
          for tool in make rsvg-convert lualatex pdfinfo kpsewhich rg shasum; do
            command -v "$tool" || exit 1
          done
          kpsewhich IEEEtran.cls >/dev/null || {
            echo 'The publication runner requires IEEEtran.cls for the new manuscript.' >&2
            exit 1
          }
          make -C docs/paper check CARGO_TARGET_DIR="$PWD/target/paper-artifacts-ci"
      - name: Upload the reviewed IEEE-style manuscript and build receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ieee-paper-${{ github.sha }}
          path: |
            target/ieee/paper/main.pdf
            target/ieee/paper/supplement.pdf
            target/ieee/paper/INPUT_FILES
            target/ieee/paper/supplement-pdfinfo.txt
            target/ieee/paper/synthetic-geometry/
            target/ieee/paper/population-latest.png
            target/ieee/paper/inheritance.png
            target/ieee/paper/evidence-architecture.png
            docs/paper/figure-semantics.v1.json
            docs/paper/claim-evidence.v1.json
            docs/paper/generated/crop-semantics.v1.json
            docs/paper/generated/population/point-rendering.v1.json
            target/ieee/paper/plate-fields.png
            target/ieee/paper/verification.png
            target/ieee/paper/assessment.png
            target/ieee/paper/battery-matrix.png
            target/ieee/paper/lineage.png
            target/ieee/paper/fitness.png
            target/ieee/paper/population.png
            target/ieee/paper/cover-evolution.png
            target/ieee/paper/SOURCE_SHA256SUMS
            target/ieee/paper/OUTPUT_SHA256SUMS
            target/ieee/paper/toolchain.txt
            target/ieee/paper/pdfinfo.txt
            docs/paper/figure-inputs.v1.json
            docs/paper/field-inputs.v1.json
            docs/paper/verification-inputs.v1.json
            docs/paper/assessment-inputs.v1.json
            docs/paper/battery-inputs.v1.json
            docs/paper/lineage-inputs.v1.json
            docs/paper/figures/v2/hero_dark.manifest.json
            docs/paper/figures/v2/hero_dark.scene.json
            docs/paper/generated/manifest.json
            docs/paper/weighted-inputs.v1.json
            docs/paper/generated/weighted-runs.svg
            docs/paper/generated/weighted-runs.json
            docs/paper/generated/weighted-runs.svg.manifest.json
            target/ieee/paper/weighted-runs.png
            evidence/evolution_waves/2026-10-18_ultralight_v1/*/*/fitness_curve.json
            docs/paper/reference-inputs.v1.json
            docs/paper/generated/reference.svg
            docs/paper/generated/reference.json
            docs/paper/generated/reference.svg.manifest.json
            target/ieee/paper/reference.png
            docs/paper/export-inputs.v1.json
            docs/paper/generated/export-identity.svg
            docs/paper/generated/export-identity.json
            docs/paper/generated/export-identity.svg.manifest.json
            target/ieee/paper/export-identity.png
            docs/tests/catalog.json
            docs/tests/README.md
            docs/tests/visuals.md
            docs/tests/visuals.v1.json
            docs/paper/generated/plate-fields.json
            docs/paper/generated/plate-fields.svg
            docs/paper/generated/plate-fields.svg.manifest.json
            docs/paper/generated/verification.json
            docs/paper/generated/verification.svg
            docs/paper/generated/verification.svg.manifest.json
            docs/paper/generated/assessment.json
            docs/paper/generated/assessment.svg
            docs/paper/generated/assessment.svg.manifest.json
            docs/paper/generated/battery-matrix.json
            docs/paper/generated/battery-matrix.svg
            docs/paper/generated/battery-matrix.svg.manifest.json
            docs/paper/generated/lineage.json
            docs/paper/generated/lineage.svg
            docs/paper/generated/lineage.svg.manifest.json
          if-no-files-found: error
      - name: Upload publication PDFs and SHA-256 manifest artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publication-pdfs
          path: |
            target/paper/WHITEPAPER.pdf
            target/paper/ENGINEERING_GATES_AND_EVOLUTION.pdf
            target/paper/WHITEPAPER.pdf.manifest.json
            target/paper/ENGINEERING_GATES_AND_EVOLUTION.pdf.manifest.json
            target/paper/SHA256SUMS
          if-no-files-found: error

